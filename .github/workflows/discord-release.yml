name: Schichtiva Release zu Discord

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Changelog an Discord senden
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json

          with open("DISCORD_CHANGELOG.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()

          chunks = []

          while text:
              if len(text) <= 1900:
                  chunks.append(text)
                  break

              cut = text.rfind("\n", 0, 1900)

              if cut <= 0:
                  cut = 1900

              chunks.append(text[:cut])
              text = text[cut:].lstrip()

          for number, chunk in enumerate(chunks):
              with open(f"/tmp/discord-{number}.json", "w", encoding="utf-8") as f:
                  json.dump({"content": chunk}, f, ensure_ascii=False)
          PY

          for file in /tmp/discord-*.json; do
            curl --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data-binary "@$file" \
              "$DISCORD_WEBHOOK"
          done
